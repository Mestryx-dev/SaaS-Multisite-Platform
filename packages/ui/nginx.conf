server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Storybook static: assets + iframe manager/preview
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|ttf|png|svg|ico|map)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
