name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install graphifyy
        run: uv tool install graphifyy

      - name: Rebuild AST knowledge graph
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./scripts/graphify-update.sh

      - name: Upload GRAPH_REPORT
        uses: actions/upload-artifact@v4
        with:
          name: graphify-report
          path: graphify-out/GRAPH_REPORT.md
          retention-days: 7
          if-no-files-found: error

  monorepo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mestryx_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mestryx_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mestryx_platform
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-change-me-min-32-chars-long!!
      BETTER_AUTH_URL: http://localhost:3001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # packageManager in package.json supplies the pnpm version (do not set `version` here)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: i18n parity
        run: pnpm check:i18n

      - name: Migrate
        run: pnpm --filter @mestryx/api db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect AI design anti-patterns (packages/ui first)
        run: npx --yes impeccable@latest detect packages/ui/src --json
        # Expand to apps after legacy CSS migrate; start UI-package-only as planned.

  # Promo MP4s for social/ads only — not embedded on storefront.
  # Heavy job: main pushes + manual dispatch (forks can disable). Label a PR `remotion` to opt in.
  remotion:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'remotion'))
    steps:
      - uses: actions/checkout@v4

      # packageManager in package.json supplies the pnpm version (do not set `version` here)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ensure Remotion browser
        run: pnpm --filter @mestryx/remotion exec remotion browser ensure

      - name: Typecheck Remotion
        run: pnpm --filter @mestryx/remotion typecheck

      - name: Render promo compositions
        run: pnpm --filter @mestryx/remotion run ci:render

      - name: Upload promo MP4s
        uses: actions/upload-artifact@v4
        with:
          name: remotion-promos
          path: apps/remotion/out/*.mp4
          retention-days: 7
          if-no-files-found: error
