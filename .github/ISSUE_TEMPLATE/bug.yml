name: Bug report
description: Report a defect with reproduction steps
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not** paste production secrets or personal data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, expected vs actual, environment (OS, Node, browser).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / tag
      description: e.g. main SHA or release tag
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: This report contains no secrets
          required: true
