server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Prefer a real redirect for apex (Astro also emits a meta refresh on /)
  location = / {
    return 302 /fr;
  }

  # Astro static with locale prefixes (/fr, /en)
  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
